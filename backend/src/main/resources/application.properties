spring.application.name=auth-backend

spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.ygycbrrszmgxpmmbmejv
spring.datasource.password=#Josefcajes2002
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable Open Session in View (anti-pattern that causes performance issues)
spring.jpa.open-in-view=false

# PostgreSQL LONGBLOB handling - Hibernate will map LONGBLOB to PostgreSQL bytea automatically
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=8080

# JWT Configuration
jwt.secret=FarmVilleSecretKey2024VeryLongSecretKeyForHS256AlgorithmMustBe256Bits
jwt.expiration=86400000

# CORS is handled in code (SecurityConfig.java)
# Max upload file size (for profile image uploads)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Local directory used for static uploaded files (served as /uploads/**)
app.upload.dir=C:/project/uploads/

# Logging
logging.level.org.springframework=INFO
logging.level.com.authapp=DEBUG
logging.level.org.springframework.security=DEBUG

spring.datasource.hikari.connection-init-sql=SET bytea_output = 'escape'
