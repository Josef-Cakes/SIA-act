spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties],optional:file:../.env[.properties],optional:file:../.env.local[.properties]

spring.application.name=${APP_NAME:auth-backend}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-init-sql=${DB_CONNECTION_INIT_SQL:SET bytea_output = 'escape'}

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloud providers inject PORT at runtime.
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS and uploads
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# Optional bootstrap admin. Keep disabled in production.
app.default-admin.enabled=${APP_DEFAULT_ADMIN_ENABLED:false}
app.default-admin.username=${APP_DEFAULT_ADMIN_USERNAME:}
app.default-admin.email=${APP_DEFAULT_ADMIN_EMAIL:}
app.default-admin.password=${APP_DEFAULT_ADMIN_PASSWORD:}

# Logging
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.com.authapp=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
