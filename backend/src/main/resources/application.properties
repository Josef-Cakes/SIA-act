spring.application.name=${APP_NAME:auth-backend}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Optional root .env import for local development. Deployment environments
# should inject these values through their secret manager.
spring.config.import=optional:file:../.env[.properties]

# Apply versioned migrations by default; disable only for isolated tests.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:3}

# Supabase Transaction Pooler URL must use port 6543, for example:
# jdbc:postgresql://aws-0-region.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:}}
spring.datasource.username=${DB_USER:${DB_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings tuned for hosted PostgreSQL poolers.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:${DB_MAX_POOL_SIZE:5}}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:${DB_MIN_IDLE:1}}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-init-sql=${DB_CONNECTION_INIT_SQL:SET bytea_output = 'escape'}

# Production-safe JPA/Hibernate settings.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Render injects PORT at runtime. The Dockerfile exposes 8080.
server.address=0.0.0.0
server.port=${PORT:${SERVER_PORT:8080}}

# JWT configuration.
jwt.secret=FarmVilleSecretKey2024VeryLongSecretKeyForHS256AlgorithmMustBe256Bits
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS, uploads, and request limits.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:5MB}
app.upload.dir=${APP_UPLOAD_DIR:/tmp/uploads}

# Optional bootstrap admin. Keep disabled in production.
app.default-admin.enabled=${APP_DEFAULT_ADMIN_ENABLED:false}
app.default-admin.username=${APP_DEFAULT_ADMIN_USERNAME:}
app.default-admin.email=${APP_DEFAULT_ADMIN_EMAIL:}
app.default-admin.password=${APP_DEFAULT_ADMIN_PASSWORD:}

# Logging.
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.com.authapp=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
