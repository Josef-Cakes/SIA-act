spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Render/Railway production database bootstrap.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.upload.dir=${APP_UPLOAD_DIR:/tmp/uploads}
app.default-admin.enabled=${APP_DEFAULT_ADMIN_ENABLED:false}
app.default-admin.username=${APP_DEFAULT_ADMIN_USERNAME:}
app.default-admin.email=${APP_DEFAULT_ADMIN_EMAIL:}
app.default-admin.password=${APP_DEFAULT_ADMIN_PASSWORD:}

logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.com.authapp=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
